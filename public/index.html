@import url("https://fonts.googleapis.com/css?family=Luckiest+Guy&display=swap");

/* Reset and Global Styles */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; } /* تعطيل التمرير الأفقي */
body { 
  font-family: 'Changa', sans-serif; 
  background: #121212; 
  color: #e0e0e0; 
  text-align: left;
}

/* تعطيل التمرير في البداية */
body.no-scroll {
  overflow: hidden;
}
/* على الهواتف، تثبيت الصفحة عند تعطيل التمرير */
@media (max-width: 768px) {
  body.no-scroll {
    position: fixed;
    width: 100%;
  }
}

/* تأثيرات التلاشي والتصغير */
main.container, #mainContent {
  transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
}

/* الحالة الأولية */
main.container.initial {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  opacity: 1;
  transform: scale(1);
  padding: 20px;
}

/* إزالة الحالة الأولية */
main.container:not(.initial) {
  display: block;
  padding: 0;
}

/* قسم الإدخال */
#inputSection {
  text-align: center;
  margin-bottom: 2rem;
  position: relative;
  width: 100%;
  max-width: 600px;
}

/* تنسيق العنوان */
#inputSection h1 {
  font-family: "Luckiest Guy", cursive;
  font-size: clamp(2rem, 5vw, 3rem);
  color: #ecf0f1;
  margin-bottom: 1rem;
  margin-top: -2rem;
}
#inputSection h1 span {
  transform: scale(0.9);
  display: inline-block;
}
#inputSection h1 span:first-child {
  animation: bop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards infinite alternate;
}
#inputSection h1 span:last-child {
  animation: bopB 1s 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards infinite alternate;
}
@keyframes bop {
  0% { transform: scale(0.9); }
  50%, 100% { transform: scale(1); }
}
@keyframes bopB {
  0% { transform: scale(0.9); }
  80%, 100% { transform: scale(1) rotateZ(-3deg); }
}

/* المحتوى الرئيسي */
#mainContent {
  display: none;
  opacity: 0;
}
main.container:not(.initial) #mainContent {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 1rem;
  padding: 1rem;
}

/* تنسيق حقل الإدخال */
#magnetField { 
  margin-bottom: 2rem; 
  width: 100%;
}
#magnetField input[type="text"] {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid #555;
  border-radius: 5px;
  font-size: 1rem;
  background: #333;
  color: #e0e0e0;
  margin-top: 2rem;
}
#magnetField button {
  margin-top: 1rem;
  padding: 0.75rem 1.5rem;
  border: none;
  background: #3498db;
  color: #fff;
  border-radius: 5px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s;
}
#magnetField button:hover { background: #2980b9; }
#errorMessage { 
  color: #e74c3c; 
  margin-bottom: 1rem; 
  display: none; 
  font-size: 0.9rem; 
}

/* قسم اللودر */
#loader { 
  display: none; 
  margin-top: 0.5rem;
  text-align: center;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 1s ease;
  transform: translateY(-20px); /* تحريك اللودر لأعلى قليلاً */
}
.peer-counter { 
  margin-top: 0; /* إظهار Peers والعدد مباشرة تحت اللودر */
  font-size: 1.5rem; /* تكبير النص قليلاً */
  color: #ecf0f1;
}
/* تلوين رقم البير باللون الأخضر */
#peerCount {
  color: #27ae60;
  font-weight: bold;
}

/* الشريط الجانبي */
.sidebar { 
  background: #1e1e1e; 
  border-radius: 10px; 
  padding: 1rem; 
}
#torrentDetails { 
  background: #1e1e1e; 
  border: 1px solid #555; 
  border-radius: 10px; 
  padding: 1rem; 
  margin-bottom: 1rem;
}
#torrentDetails h3 { 
  text-align: center; 
  margin-bottom: 1rem; 
  color: #ecf0f1; 
  font-size: 1.25rem; 
}
#torrentDetails p { 
  margin-bottom: 0.5rem; 
  font-size: 0.9rem; 
  color: #ccc; 
}
.progress-bar { 
  width: 100%; 
  background: #555; 
  border-radius: 5px; 
  overflow: hidden; 
  margin-top: 0.5rem; 
  height: 0.75rem; 
}
.progress-bar-fill { 
  height: 100%; 
  background: #27ae60; 
  width: 0%; 
  transition: width 0.5s ease-in-out; 
}
.progress-header { 
  display: flex; 
  justify-content: space-between; 
  font-size: 0.9rem; 
  margin-bottom: 0.25rem; 
}

/* قسم ملفات التورنت */
#torrentFilesContainer {
  margin-top: 1rem;
  background: #1e1e1e;
  border: 1px solid #555;
  border-radius: 10px;
  padding: 1rem;
}
#torrentFilesContainer h3 {
  text-align: center;
  margin-bottom: 1rem;
  color: #ecf0f1;
  font-size: 1.25rem;
}
.folder-group { 
  background: #1e1e1e; 
  border: 1px solid #555; 
  border-radius: 5px; 
  margin-bottom: 1rem; 
}
.folder-header { 
  padding: 0.5rem; 
  background: #555; 
  border-radius: 5px 5px 0 0; 
  cursor: pointer; 
  display: flex; 
  align-items: center; 
}
.folder-header span { 
  margin-left: 0.5rem; 
}
.folder-header i.fa-folder, .folder-header i.fa-folder-open { 
  color: yellow; 
}
.files-list { 
  display: none; 
  padding: 0.5rem; 
}
.file-item { 
  display: flex; 
  align-items: center; 
  margin-bottom: 0.5rem; 
  padding: 0.25rem; 
  border-bottom: 1px solid #555; 
}
.file-item:last-child { border-bottom: none; }
.file-item i { margin-right: 0.5rem; font-size: 1rem; }
.file-info { display: flex; flex-direction: column; }
/* تقصير النصوص لمنع تمدد الكونتينر عند أسماء الملفات الطويلة */
.file-info p {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
}
.file-info span { font-size: 0.8rem; color: #ccc; }

/* منطقة المحتوى */
.content { 
  background: #1e1e1e; 
  border: 1px solid #555; 
  border-radius: 10px; 
  padding: 1rem; 
}
#videoContainer { 
  display: none; 
  margin-bottom: 1rem; 
}
/* إضافة إطار أبيض حول مشغل الفيديو */
#videoContainer video { 
  width: 100%; 
  border-radius: 10px; 
  border: 2px solid #fff;
}
.control-buttons { 
  display: flex; 
  justify-content: center; 
  margin-top: 1rem; 
  gap: 1rem; 
}
.control-buttons button {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 5px;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s;
}
#copyLinkButton { background: #27ae60; }
#copyLinkButton:hover { background: #1e8449; }
#removeButton { background: #e74c3c; }
#removeButton:hover { background: #c0392b; }

/* قسم اختيار الحلقة */
#videoSelection { 
  text-align: center; 
  margin-top: 1rem; 
  display: none; 
}
/* تغيير تنسيق الـ label ووضعه فوق صندوق الاختيارات */
#videoSelection label { 
  display: block;
  margin-bottom: 0.5rem;
  font-size: 1rem; 
  color: #fff;
}
/* تصميم الـ select box ليكون عرضه 100% مثل مشغل الفيديو */
#videoSelect { 
  padding: 0.75rem; 
  font-size: 1rem; 
  border: 1px solid #fff;
  border-radius: 5px; 
  background: #333;
  color: #e0e0e0;
  width: 100%;
}

/* مودال الصورة */
#imageModal { 
  display: none; 
  position: fixed; 
  z-index: 10000; 
  left: 0; top: 0; 
  width: 100%; 
  height: 100%; 
  overflow: auto; 
  background: rgba(0,0,0,0.8); 
}
.modal-content { 
  position: relative; 
  margin: 5% auto; 
  max-width: 90%; 
  max-height: 90vh; 
}
.modal-content img { 
  width: 100%; 
  height: auto; 
  border-radius: 10px; 
  display: block; 
}
.modal-close { 
  position: absolute; 
  top: -10px; right: -10px; 
  background: #e74c3c; 
  color: #fff; 
  border-radius: 50%; 
  font-size: 1.5rem; 
  width: 2rem; 
  height: 2rem; 
  text-align: center; 
  line-height: 2rem; 
  cursor: pointer; 
  box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
}

/* Media Queries للشاشات الصغيرة */
@media (max-width: 768px) {
  main.container:not(.initial) #mainContent {
    grid-template-columns: 1fr;
    padding: 0.5rem;
  }
  #inputSection h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
  }
  #magnetField input[type="text"] {
    font-size: 0.9rem;
    padding: 0.5rem;
  }
  #magnetField button {
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
  }
  .control-buttons button {
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
  }
  #torrentDetails h3, #torrentFilesContainer h3 {
    font-size: 1rem;
  }
  .file-info p { max-width: 150px; }
  .file-info p, .file-info span { font-size: 0.8rem; }
}

@media (max-width: 480px) {
  #inputSection {
    padding: 0 1rem;
  }
  #magnetField button {
    width: 100%;
    max-width: 200px;
  }
}

#buttonContainer button {
  font-size: 1.5rem;
  color: #fafafa;
  text-transform: uppercase;
  padding: 10px 20px;
  border-radius: 10px;
  border: 2px solid #fafafa;
  background: #252525;
  box-shadow: 3px 3px #fafafa;
  cursor: pointer;
  margin: 35px 0;
}

#buttonContainer button:active {
  box-shadow: none;
  transform: translate(3px, 3px);
}

/* From Uiverse.io by SouravBandyopadhyay */ 
.hourglassBackground {
  position: relative;
  background-color: rgb(71, 60, 60);
  height: 130px;
  width: 130px;
  border-radius: 50%;
  margin: 30px auto;
}

.hourglassContainer {
  position: absolute;
  top: 30px;
  left: 40px;
  width: 50px;
  height: 70px;
  -webkit-animation: hourglassRotate 2s ease-in 0s infinite;
  animation: hourglassRotate 2s ease-in 0s infinite;
  transform-style: preserve-3d;
  perspective: 1000px;
}

.hourglassContainer div,
.hourglassContainer div:before,
.hourglassContainer div:after {
  transform-style: preserve-3d;
}

@-webkit-keyframes hourglassRotate {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(180deg); }
  100% { transform: rotateX(180deg); }
}

@keyframes hourglassRotate {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(180deg); }
  100% { transform: rotateX(180deg); }
}

.hourglassCapTop { top: 0; }
.hourglassCapTop:before { top: -25px; }
.hourglassCapTop:after { top: -20px; }
.hourglassCapBottom { bottom: 0; }
.hourglassCapBottom:before { bottom: -25px; }
.hourglassCapBottom:after { bottom: -20px; }

.hourglassGlassTop {
  transform: rotateX(90deg);
  position: absolute;
  top: -16px;
  left: 3px;
  border-radius: 50%;
  width: 44px;
  height: 44px;
  background-color: #999999;
}

.hourglassGlass {
  perspective: 100px;
  position: absolute;
  top: 32px;
  left: 20px;
  width: 10px;
  height: 6px;
  background-color: #999999;
  opacity: 0.5;
}

.hourglassGlass:before,
.hourglassGlass:after {
  content: '';
  display: block;
  position: absolute;
  background-color: #999999;
  left: -17px;
  width: 44px;
  height: 28px;
}

.hourglassGlass:before {
  top: -27px;
  border-radius: 0 0 25px 25px;
}

.hourglassGlass:after {
  bottom: -27px;
  border-radius: 25px 25px 0 0;
}

.hourglassCurves:before,
.hourglassCurves:after {
  content: '';
  display: block;
  position: absolute;
  top: 32px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: #333;
  animation: hideCurves 2s ease-in 0s infinite;
}

.hourglassCurves:before { left: 15px; }
.hourglassCurves:after { left: 29px; }

@-webkit-keyframes hideCurves {
  0% { opacity: 1; }
  25% { opacity: 0; }
  30% { opacity: 0; }
  40% { opacity: 1; }
  100% { opacity: 1; }
}

@keyframes hideCurves {
  0% { opacity: 1; }
  25% { opacity: 0; }
  30% { opacity: 0; }
  40% { opacity: 1; }
  100% { opacity: 1; }
}

.hourglassSandStream:before {
  content: '';
  display: block;
  position: absolute;
  left: 24px;
  width: 3px;
  background-color: white;
  -webkit-animation: sandStream1 2s ease-in 0s infinite;
  animation: sandStream1 2s ease-in 0s infinite;
}

.hourglassSandStream:after {
  content: '';
  display: block;
  position: absolute;
  top: 36px;
  left: 19px;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 6px solid #fff;
  animation: sandStream2 2s ease-in 0s infinite;
}

@-webkit-keyframes sandStream1 {
  0% { height: 0; top: 35px; }
  50% { height: 0; top: 45px; }
  60% { height: 35px; top: 8px; }
  85% { height: 35px; top: 8px; }
  100% { height: 0; top: 8px; }
}

@keyframes sandStream1 {
  0% { height: 0; top: 35px; }
  50% { height: 0; top: 45px; }
  60% { height: 35px; top: 8px; }
  85% { height: 35px; top: 8px; }
  100% { height: 0; top: 8px; }
}

@-webkit-keyframes sandStream2 {
  0% { opacity: 0; }
  50% { opacity: 0; }
  51% { opacity: 1; }
  90% { opacity: 1; }
  91% { opacity: 0; }
  100% { opacity: 0; }
}

@keyframes sandStream2 {
  0% { opacity: 0; }
  50% { opacity: 0; }
  51% { opacity: 1; }
  90% { opacity: 1; }
  91% { opacity: 0; }
  100% { opacity: 0; }
}

.hourglassSand:before,
.hourglassSand:after {
  content: '';
  display: block;
  position: absolute;
  left: 6px;
  background-color: white;
  perspective: 500px;
}

.hourglassSand:before {
  top: 8px;
  width: 39px;
  border-radius: 3px 3px 30px 30px;
  animation: sandFillup 2s ease-in 0s infinite;
}

.hourglassSand:after {
  border-radius: 30px 30px 3px 3px;
  animation: sandDeplete 2s ease-in 0s infinite;
}

@-webkit-keyframes sandFillup {
  0% { opacity: 0; height: 0; }
  60% { opacity: 1; height: 0; }
  100% { opacity: 1; height: 17px; }
}

@keyframes sandFillup {
  0% { opacity: 0; height: 0; }
  60% { opacity: 1; height: 0; }
  100% { opacity: 1; height: 17px; }
}

@-webkit-keyframes sandDeplete {
  0% { opacity: 0; top: 45px; height: 17px; width: 38px; left: 6px; }
  1% { opacity: 1; top: 45px; height: 17px; width: 38px; left: 6px; }
  24% { opacity: 1; top: 45px; height: 17px; width: 38px; left: 6px; }
  25% { opacity: 1; top: 41px; height: 17px; width: 38px; left: 6px; }
  50% { opacity: 1; top: 41px; height: 17px; width: 38px; left: 6px; }
  90% { opacity: 1; top: 41px; height: 0; width: 10px; left: 20px; }
}

@keyframes sandDeplete {
  0% { opacity: 0; top: 45px; height: 17px; width: 38px; left: 6px; }
  1% { opacity: 1; top: 45px; height: 17px; width: 38px; left: 6px; }
  24% { opacity: 1; top: 45px; height: 17px; width: 38px; left: 6px; }
  25% { opacity: 1; top: 41px; height: 17px; width: 38px; left: 6px; }
  50% { opacity: 1; top: 41px; height: 17px; width: 38px; left: 6px; }
  90% { opacity: 1; top: 41px; height: 0; width: 10px; left: 20px; }
}

.popup-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
    z-index: 1000;
}

.popup-container.show {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s ease;
}

.popup-content {
    background: #333333;
    color: #ffffff;
    padding: 25px;
    border-radius: 20px;
    width: 80%;
    max-width: 900px;
    min-width: 300px;
    position: relative;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    transform: translateY(-100%) scale(0.8);
    opacity: 0;
    transition: transform 0.5s ease, opacity 0.5s ease;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.popup-container.show .popup-content {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.popup-content::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(0, 123, 255, 0.1), transparent);
    z-index: -1;
    animation: pulse 10s infinite ease-in-out;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.counter-controls {

.counter-btn {
    width: 50px;

    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
    background: linear-gradient(45deg, #28a745, #34c759);

    box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);

.counter-btn.minus {

  <!-- Plyr JS --><script src="https://cdn.plyr.io/3.7.2/plyr.polyfilled.js"></script>
<script>
  const player = new Plyr('#videoPlayer', {
    captions: { active: true, language: 'ar', update: true }
  });
  let currentMagnetLink = '';
  let currentFileIndex = '0';
  let openFolders = {};
  let autoUpdateInterval;
  let peerCounterInterval;
  let currentPeerCounter = 0;
  let actualPeerCount = 0;

  let subtitleDelay = 0;
  let subtitleFontSize = 20;

  function changeSubtitleSize(amount) {
    subtitleFontSize = Math.max(10, Math.min(40, subtitleFontSize + amount));
    document.documentElement.style.setProperty('--subtitle-font-size', `${subtitleFontSize}px`);
    document.querySelector('.counter-display').textContent = subtitleFontSize;
  }

  function adjustSubtitleDelay(amount) {
    subtitleDelay += amount;
    const timingDisplay = document.querySelector('.timing-display');
    timingDisplay.textContent = (subtitleDelay / 1000).toFixed(1);
  }

  function fixArabicPunctuation(text) {
    return text
      .replace(/\(([^()]+)\)/g, '($1)')
      .replace(/،/g, ',')
      .replace(/([^\s])\(/g, '$1 (')
      .replace(/\)([^\s])/g, ') $1');
  }

  function convertSRTtoVTT(srtText) {
    const fixedText = fixArabicPunctuation(srtText);
    return 'WEBVTT\n\n' + fixedText
      .replace(/\r\n/g, '\n')
      .replace(/(\d+:\d+:\d+),(\d+)/g, (match, time, ms) => {
        const timeParts = time.split(':');
        const totalMs = (parseInt(timeParts[0]) * 3600 + parseInt(timeParts[1]) * 60 + parseFloat(timeParts[2])) * 1000 + parseInt(ms);
        const adjustedTime = new Date(Math.max(0, totalMs + subtitleDelay));
        const hh = String(adjustedTime.getUTCHours()).padStart(2, '0');
        const mm = String(adjustedTime.getUTCMinutes()).padStart(2, '0');
        const ss = String(adjustedTime.getUTCSeconds()).padStart(2, '0');
        const mss = String(adjustedTime.getUTCMilliseconds()).padStart(3, '0');
        return `${hh}:${mm}:${ss}.${mss}`;
      })
      .replace(/^\d+\s*$/gm, '')
      .replace(/(\d{2}:\d{2}:\d{2}\.\d{3}) --> (\d{2}:\d{2}:\d{2}\.\d{3})/g, '$1 --> $2')
      .replace(/\n{2,}/g, '\n\n')
      .trim();
  }

  function isContentReadable(text) {
    return /[\u0600-\u06FF]/.test(text) && !text.includes('???');
  }

  async function decodeSRTFile(file) {
    const buffer = await file.arrayBuffer();
    try {
      const utf8 = new TextDecoder('utf-8', { fatal: true });
      const decoded = utf8.decode(buffer);
      if (isContentReadable(decoded)) return decoded;
      throw new Error();
    } catch {
      const win1256 = new TextDecoder('windows-1256');
      return win1256.decode(buffer);
    }
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file || !file.name.endsWith('.srt')) return alert("يرجى اختيار ملف .srt");

    const decodedText = await decodeSRTFile(file);
    const vttContent = convertSRTtoVTT(decodedText);
    const blob = new Blob([vttContent], { type: 'text/vtt;charset=UTF-8' });
    const subtitleUrl = URL.createObjectURL(blob);

    Array.from(player.media.querySelectorAll('track')).forEach(t => t.remove());

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.label = 'Arabic';
    track.srclang = 'ar';
    track.src = subtitleUrl;
    track.default = true;
    player.media.appendChild(track);

    player.source = {
      type: 'video',
      sources: [{
        src: player.source.sources[0].src,
        type: player.source.sources[0].type
      }],
      tracks: [{
        kind: 'subtitles',
        label: 'Arabic',
        srclang: 'ar',
        src: subtitleUrl,
        default: true
      }]
    };

    await new Promise(r => setTimeout(r, 500));
    player.toggleCaptions(true);
  });

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " bytes";
    else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + " KB";
    else if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + " MB";
    else return (bytes / 1073741824).toFixed(2) + " GB";
  }

  function toggleTranslationPopup() {
    const popup = document.getElementById('translationPopup');
    const toggleButton = document.getElementById('toggleTranslationControls');
    if (popup.classList.contains('show')) {
      popup.classList.remove('show');
      toggleButton.querySelector('i').style.transform = 'rotate(0deg)';
    } else {
      popup.classList.add('show');
      toggleButton.querySelector('i').style.transform = 'rotate(180deg)';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const fileInputContainer = document.querySelector('#fileInputContainer');
    const fileInput = document.querySelector('#fileInput');
    fileInputContainer.addEventListener('click', () => fileInput.click());

    const colorInput = document.querySelector('#color-input');
    colorInput.addEventListener('input', () => {
      document.documentElement.style.setProperty('--subtitle-color', colorInput.value);
    });

    const accordionHeader = document.querySelector('.accordion-header');
    const accordionContent = document.querySelector('.accordion-content');
    const accordionArrow = document.querySelector('.accordion-arrow');
    accordionHeader.addEventListener('click', () => {
      accordionContent.classList.toggle('show');
      accordionArrow.style.transform = accordionContent.classList.contains('show') 
        ? 'rotate(180deg)' 
        : 'rotate(0deg)';
    });
  });

  function startStreaming() {
    const magnetLink = document.getElementById('magnetLink').value.trim();
    const errorMessage = document.getElementById('errorMessage');
    const loader = document.getElementById('loader');
    const videoContainer = document.getElementById('videoContainer');
    const torrentDetails = document.getElementById('torrentDetails');

    if (!magnetLink) {
      errorMessage.textContent = '⚠️ الرجاء ادخال رابط Magnet!';
      errorMessage.style.display = 'block';
      loader.style.display = 'none';
      videoContainer.style.display = 'none';
      torrentDetails.style.display = 'none';
      return;
    }
    
    if (!magnetLink.startsWith("magnet:")) {
      errorMessage.textContent = '⚠️ الرجاء ادخال رابط Magnet صالح!';
      errorMessage.style.display = 'block';
      loader.style.display = 'none';
      videoContainer.style.display = 'none';
      torrentDetails.style.display = 'none';
      return;
    }

    errorMessage.textContent = '';
    errorMessage.style.display = 'none';
    currentMagnetLink = magnetLink;
    currentFileIndex = '0';

    document.querySelector('#torrentProgressBar .progress-bar-fill').style.width = "0%";
    document.getElementById("progressPercent").textContent = "0%";

    const videoSrc = `/stream?magnet=${encodeURIComponent(magnetLink)}&fileIndex=0`;
    player.source = {
      type: 'video',
      sources: [{ src: videoSrc, type: 'video/mp4' }]
    };

    loader.style.display = 'flex';
    setTimeout(() => {
      loader.style.opacity = '1';
    }, 50);
    
    videoContainer.style.display = 'none';
    torrentDetails.style.display = 'none';
    document.getElementById('videoSelection').style.display = 'none';

    currentPeerCounter = 0;
    document.getElementById("peerCount").textContent = currentPeerCounter;
    if (peerCounterInterval) clearInterval(peerCounterInterval);
    peerCounterInterval = setInterval(() => {
      if (currentPeerCounter < actualPeerCount) {
        currentPeerCounter++;
        document.getElementById("peerCount").textContent = currentPeerCounter;
      }
    }, 100);

    fetchTorrentDetails(magnetLink);
    startAutoUpdate();

    setTimeout(() => {
      loader.style.opacity = '0';
      loader.style.display = 'none';
      document.getElementById('inputSection').style.display = 'none';
      const container = document.querySelector('main.container');
      container.classList.remove('initial');
      const mainContent = document.getElementById('mainContent');
      mainContent.style.display = 'grid';
      mainContent.style.opacity = 0;
      setTimeout(() => {
        mainContent.style.opacity = 1;
      }, 100);
      videoContainer.style.display = 'block';
      torrentDetails.style.display = 'block';
      const videoSelect = document.getElementById('videoSelect');
      if (videoSelect.options.length > 1) {
        document.getElementById('videoSelection').style.display = 'block';
      }
      document.body.classList.remove('no-scroll');
      clearInterval(peerCounterInterval);
    }, 10000);
  }

  function copyLink() {
    if (currentMagnetLink) {
      let url = `/stream?magnet=${encodeURIComponent(currentMagnetLink)}`;
      if (currentFileIndex !== "0") {
        url += `&fileIndex=${currentFileIndex}`;
      }
      const fullURL = `http://${window.location.hostname}:10000${url}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(fullURL)
          .then(() => {
            const copyButton = document.getElementById('copyLinkButton');
            const originalHTML = '<i class="fa-solid fa-copy"></i>';
            copyButton.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => {
              copyButton.innerHTML = originalHTML;
            }, 2000);
          })
          .catch(err => {
            fallbackCopyText(fullURL);
          });
      } else {
        fallbackCopyText(fullURL);
      }
    } else {
      alert('Video not streaming yet!');
    }
  }

  function fallbackCopyText(text) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      const successful = document.execCommand('copy');
      if (successful) {
        const copyButton = document.getElementById('copyLinkButton');
        const originalHTML = '<i class="fa-solid fa-copy"></i>';
        copyButton.innerHTML = '<i class="fa-solid fa-check"></i>';
        setTimeout(() => {
          copyButton.innerHTML = originalHTML;
        }, 2000);
      } else {
        alert('Failed to copy link!');
      }
    } catch (err) {
      alert('Failed to copy link!');
    }
    document.body.removeChild(textArea);
  }

  function changeVideo() {
    const videoSelect = document.getElementById('videoSelect');
    currentFileIndex = videoSelect.value;
    const videoSrc = `/stream?magnet=${encodeURIComponent(currentMagnetLink)}&fileIndex=${currentFileIndex}`;
    player.source = {
      type: 'video',
      sources: [{ src: videoSrc, type: 'video/mp4' }]
    };
    player.play();
  }

  function fetchTorrentDetails(magnetLink) {
    fetch(`/torrent-info?magnet=${encodeURIComponent(magnetLink)}`)
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          console.error(data.error);
          return;
        }
        document.getElementById('torrentName').textContent = `Torrent Name: ${data.name}`;
        document.getElementById('torrentAccessCount').textContent = `Listeners: ${data.accessCount}`;
        document.getElementById('torrentPeers').textContent = `Peers: ${data.numPeers}`;
        actualPeerCount = parseInt(data.numPeers) || 0;

        let selectedProgress = 0;
        if (data.files && data.files.length > 0) {
          const selectedFile = data.files.find(file => file.index == currentFileIndex);
          if (selectedFile && (selectedFile.name.toLowerCase().endsWith('.mp4') || selectedFile.name.toLowerCase().endsWith('.mkv'))) {
            if (typeof selectedFile.progress === 'number') {
              selectedProgress = selectedFile.progress;
            }
          } else if (typeof data.progress === 'number') {
            selectedProgress = data.progress;
          }
        }
        const progressPercent = (selectedProgress * 100).toFixed(2) + '%';
        document.querySelector('#torrentProgressBar .progress-bar-fill').style.width = progressPercent;
        document.getElementById("progressPercent").textContent = progressPercent;

        const loader = document.getElementById('loader');
        if (loader.style.display !== 'none') {
          document.getElementById('videoSelection').style.display = 'none';
        } else {
          const videoSelect = document.getElementById('videoSelect');
          const videoFiles = data.files.filter(f => {
            const lower = f.name.toLowerCase();
            return lower.endsWith('.mp4') || lower.endsWith('.mkv');
          });
          if (videoFiles.length > 1) {
            const currentSelection = videoSelect.value;
            videoSelect.innerHTML = '';
            videoFiles.forEach(file => {
              const option = document.createElement('option');
              option.value = file.index;
              option.textContent = file.progress !== undefined && file.progress >= 1 ? ('🎥 ' + file.name + ' ✅') : ('🎥 ' + file.name);
              videoSelect.appendChild(option);
            });
            if (currentSelection && [...videoSelect.options].some(o => o.value === currentSelection)) {
              videoSelect.value = currentSelection;
              currentFileIndex = currentSelection;
            } else {
              videoSelect.value = videoSelect.options[0].value;
              currentFileIndex = videoSelect.options[0].value;
            }
            document.getElementById('videoSelection').style.display = 'block';
          } else {
            document.getElementById('videoSelection').style.display = 'none';
          }
        }

        const torrentFilesElement = document.getElementById('torrentFiles');
        torrentFilesElement.innerHTML = '<strong>Torrent Files:</strong>';
        const groups = { videos: [], images: [], subtitles: [], txt: [], others: [] };

        data.files.forEach(file => {
          const lowerName = file.name.toLowerCase();
          if (lowerName.endsWith('.mp4') || lowerName.endsWith('.mkv')) {
            groups.videos.push(file);
          } else if (/\.(jpg|jpeg|png|gif)$/.test(lowerName)) {
            groups.images.push(file);
          } else if (lowerName.endsWith('.srt')) {
            groups.subtitles.push(file);
          } else if (lowerName.endsWith('.txt')) {
            groups.txt.push(file);
          } else {
            groups.others.push(file);
          }
        });

        function createFileItem(file, groupType) {
          let iconClass = '';
          let iconColor = '';
          if (groupType === 'videos') {
            iconClass = 'fa-solid fa-file-video';
            iconColor = '#ff4500';
          } else if (groupType === 'images') {
            iconClass = 'fa-solid fa-file-image';
            iconColor = '#1e90ff';
          } else if (groupType === 'subtitles') {
            iconClass = 'fa-solid fa-closed-captioning';
            iconColor = '#32cd32';
          } else if (groupType === 'txt') {
            iconClass = 'fa-solid fa-file-lines';
            iconColor = '#8a2be2';
          } else {
            iconClass = 'fa-solid fa-file';
            iconColor = '#6c757d';
          }

          const fileItem = document.createElement('div');
          fileItem.className = 'file-item';

          const iconElement = document.createElement('i');
          iconElement.className = iconClass;
          iconElement.style.color = iconColor;
          fileItem.appendChild(iconElement);

          const infoDiv = document.createElement('div');
          infoDiv.className = 'file-info';
          const fileName = document.createElement('p');
          fileName.textContent = file.name;
          const fileSize = document.createElement('span');
          fileSize.textContent = `(${formatBytes(file.length)})`;
          infoDiv.appendChild(fileName);
          infoDiv.appendChild(fileSize);
          fileItem.appendChild(infoDiv);

          if (groupType === 'images') {
            fileItem.style.cursor = 'pointer';
            fileItem.addEventListener('click', () => openImageModal(file));
          }
          return fileItem;
        }

        function createFolderGroup(title, groupType, filesArray) {
          if (filesArray.length === 0) return null;
          const groupDiv = document.createElement('div');
          groupDiv.className = 'folder-group';

          const header = document.createElement('div');
          header.className = 'folder-header';

          const folderIcon = document.createElement('i');
          folderIcon.className = openFolders[title] ? 'fa-solid fa-folder-open' : 'fa-solid fa-folder';
          header.appendChild(folderIcon);

          const titleText = document.createElement('span');
          titleText.textContent = title;
          header.appendChild(titleText);

          groupDiv.appendChild(header);

          const filesList = document.createElement('div');
          filesList.className = 'files-list';
          filesList.style.display = openFolders[title] ? 'block' : 'none';
          filesArray.forEach(file => {
            const fileItem = createFileItem(file, groupType);
            filesList.appendChild(fileItem);
          });
          groupDiv.appendChild(filesList);

          header.addEventListener('click', () => {
            if (filesList.style.display === 'none') {
              filesList.style.display = 'block';
              folderIcon.className = 'fa-solid fa-folder-open';
              openFolders[title] = true;
            } else {
              filesList.style.display = 'none';
              folderIcon.className = 'fa-solid fa-folder';
              openFolders[title] = false;
            }
          });

          return groupDiv;
        }

        const groupsOrder = [
          { title: 'Videos', type: 'videos', files: groups.videos },
          { title: 'Images', type: 'images', files: groups.images },
          { title: 'Subtitles', type: 'subtitles', files: groups.subtitles },
          { title: 'Text Files', type: 'txt', files: groups.txt },
          { title: 'Others', type: 'others', files: groups.others }
        ];

        groupsOrder.forEach(group => {
          const groupElement = createFolderGroup(group.title, group.type, group.files);
          if (groupElement) {
            torrentFilesElement.appendChild(groupElement);
          }
        });
      })
      .catch(err => console.error('Error fetching torrent details:', err));
  }

  function startAutoUpdate() {
    if (autoUpdateInterval) clearInterval(autoUpdateInterval);
    autoUpdateInterval = setInterval(() => {
      if (currentMagnetLink) {
        fetchTorrentDetails(currentMagnetLink);
      }
    }, 1000);
  }

  function openImageModal(file) {
    const imageURL = `/stream?magnet=${encodeURIComponent(currentMagnetLink)}&fileIndex=${file.index}`;
    const modal = document.getElementById('imageModal');
    modal.querySelector('img').src = imageURL;
    modal.style.display = 'block';
  }

  function closeImageModal() {
    document.getElementById('imageModal').style.display = 'none';
  }

  window.onclick = function(event) {
    const modal = document.getElementById('imageModal');
    if (event.target === modal) {
      modal.style.display = 'none';
    }
  }

  function removeTorrent() {
    if (currentMagnetLink) {
      fetch(`/torrent/remove?magnet=${encodeURIComponent(currentMagnetLink)}`)
        .then(response => response.json())
        .then(data => {
          const container = document.querySelector('main.container');
          container.style.opacity = 0;
          container.style.transform = 'scale(0.8)';
          setTimeout(() => {
            container.style.display = 'none';
            clearInterval(autoUpdateInterval);
            location.reload(true);
          }, 500);
        })
        .catch(err => console.error('Error removing torrent:', err));
    } else {
      console.error('No torrent is currently streaming');
    }
  }
</script>
</body>

</html>
